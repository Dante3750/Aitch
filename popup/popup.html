<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>DanteHelp</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>DanteHelp</h1>
    <p id="status">Blocking ads</p>
  </header>
  <label class="switch">
    <input type="checkbox" id="toggle" checked>
    <span class="track"><span class="thumb"></span></span>
    <span class="label">Ad blocking</span>
  </label>
  <label class="switch" id="site-row" hidden>
    <input type="checkbox" id="site-toggle" checked>
    <span class="track"><span class="thumb"></span></span>
    <span class="label">On <span id="site"></span></span>
  </label>
  <p class="hint">Reload the page after switching.</p>
  <script src="popup.js"></script>
</body>
</html>
